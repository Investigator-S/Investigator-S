
name: Generate Arcade Contribution Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Arcade Animations
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Investigator-S
          games: "pacman"
          player_style: "aggressive"
          hide_month_labels: "false"

      - name: Publish Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
